<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d0f13">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect x='9.5' y='4.5' width='17' height='27' rx='4.6' fill='none' stroke='%2394a3b8' stroke-width='2.2'/%3E%3Crect x='12.4' y='13.2' width='11.2' height='9.2' rx='3' fill='%235b8cff'/%3E%3Cpath d='M17.4 21.9l-1.2 3.5 4.4-3.5z' fill='%235b8cff'/%3E%3C/svg%3E">
<title>DSH 手机遥控</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13;
    --panel: #141821;
    --panel-2: #1a1f2a;
    --line: #242b38;
    --text: #e7ebf2;
    --muted: #8b97a8;
    --accent: #5b8cff;
    --user: #22314f;
    --ok: #3ecf8e;
    --danger: #ff6b6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 10px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: rgba(13, 15, 19, 0.92);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); flex: none;
    box-shadow: 0 0 0 4px rgba(139, 151, 168, 0.12);
    transition: background 0.2s;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
  .sub { margin: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .icon-btn.on { color: var(--accent); border-color: #33508a; }
  .icon-btn:active { transform: scale(0.96); }
  main {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain;
  }
  .empty {
    margin: auto; max-width: 320px; text-align: center; color: var(--muted);
    font-size: 14px; line-height: 1.7; padding: 24px;
  }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 88%;
    padding: 10px 13px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--line);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    font-size: 15px;
  }
  .bubble.user { background: var(--user); border-color: #2c3f66; border-bottom-right-radius: 6px; }
  .bubble.assistant { border-bottom-left-radius: 6px; }
  .bubble.note { background: transparent; border-style: dashed; color: var(--muted); font-size: 13px; }
  .bubble.live::after {
    content: "▍"; color: var(--accent); margin-left: 1px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  footer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 12px 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); min-height: 18px; margin: 0 2px 6px; }
  .status .spin {
    flex: none; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; display: none;
  }
  .status.working .spin { display: inline-block; }
  .status.done { color: var(--ok); }
  .status.failed { color: var(--danger); }
  #status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .composer { display: flex; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    padding: 11px 13px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font: inherit; line-height: 1.4; outline: none;
  }
  textarea:focus { border-color: #33508a; }
  button.primary {
    flex: none; height: 44px; padding: 0 18px; border-radius: 14px; border: 0;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; }
  button.primary:active:not(:disabled) { transform: scale(0.97); }
  .overlay {
    position: fixed; inset: 0; background: rgba(8, 10, 13, 0.94);
    display: none; place-items: center; padding: 24px; z-index: 10;
  }
  .overlay.show { display: grid; }
  .card {
    width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 20px;
  }
  .card h2 { margin: 0 0 8px; font-size: 17px; }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .card input {
    width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; margin-bottom: 12px; outline: none;
  }
  .card .error { color: var(--danger); font-size: 13px; margin: 0 0 10px; }
  .card button { width: 100%; height: 44px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot" id="dot"></span>
    <div style="min-width:0">
      <h1>DSH 手机遥控</h1>
      <p class="sub" id="sub">连接中…</p>
    </div>
  </div>
  <button class="icon-btn" id="cancel" title="停止当前工作" aria-label="停止当前工作" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn" id="sound" title="开启完成提示音" aria-label="开启完成提示音" aria-pressed="false">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 9.6v4.8c0 .6.4 1 1 1h2.3l3.4 2.8c.6.5 1.6.1 1.6-.7V6.5c0-.8-1-1.2-1.6-.7l-3.4 2.8H7c-.6 0-1 .4-1 1Z" fill="currentColor"/>
      <path d="M16.6 9.1c.9.9 1.4 1.9 1.4 2.9s-.5 2-1.4 2.9M18.9 6.8c1.5 1.4 2.3 3.2 2.3 5.2s-.8 3.8-2.3 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main id="log">
  <div class="empty" id="empty">
    <strong>把手上的活交给电脑上的 DSH</strong>
    发一条任务，比如「看一下项目里 tests 为什么失败，修好并跑一遍」。<br>
    每完成一步，结果都会实时回到这里。
  </div>
</main>

<footer>
  <div class="status" id="status"><span class="spin"></span><span id="status-text">等待指令</span></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="安排一件事给 DSH…" enterkeyhint="send" autocapitalize="sentences"></textarea>
    <button class="primary" id="send">发送</button>
  </div>
</footer>

<div class="overlay" id="overlay">
  <div class="card">
    <h2>需要访问令牌</h2>
    <p>请在电脑浏览器打开 <b>http://127.0.0.1:8765/link</b>，把页面里的手机链接完整复制过来，或只粘贴链接里的令牌。</p>
    <p class="error" id="token-hint" hidden>令牌无效，请从 /link 页面重新复制。</p>
    <input id="token-input" placeholder="访问令牌" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="token-save">连接</button>
  </div>
</div>

<script>
(() => {
  'use strict'
  const $ = id => document.getElementById(id)
  const log = $('log')
  const input = $('input')
  const sendButton = $('send')
  const cancelButton = $('cancel')
  const statusEl = $('status')
  const statusText = $('status-text')
  const dot = $('dot')
  const sub = $('sub')
  const overlay = $('overlay')
  const empty = $('empty')
  const soundButton = $('sound')
  const tokenHint = $('token-hint')
  const STORAGE_KEY = 'dsh-phone-token'

  const params = new URLSearchParams(location.search)
  let token = (params.get('k') || '').trim()
  if (!token) {
    try { token = localStorage.getItem(STORAGE_KEY) || '' } catch { /* storage may be unavailable */ }
  }

  let source = null
  let connected = false
  let everConnected = false
  let needsToken = false
  let syncedOnce = false
  let sending = false
  let live = null
  let turnRendered = ''
  let assistantSeen = 0
  let lastTurnAt = null
  let helloSeen = false
  let pollTimer = 0
  let activeSessionId = null
  let sessionLabel = ''
  let pendingDelta = ''
  let deltaFrame = 0
  let audio = null
  let soundOn = false
  let titleBase = document.title
  const toolNames = new Map()

  function persistToken() {
    try { localStorage.setItem(STORAGE_KEY, token) } catch { /* storage may be unavailable */ }
  }

  async function api(path, options = {}) {
    const controller = new AbortController()
    const timer = setTimeout(() => controller.abort(), 30000)
    try {
      const init = {
        ...options,
        signal: controller.signal,
        headers: { 'x-phone-token': token, ...(options.headers || {}) },
      }
      if (options.body !== undefined) init.headers['content-type'] = 'application/json'
      return await fetch(path, init)
    } finally {
      clearTimeout(timer)
    }
  }

  function renderSub() {
    if (!connected) {
      sub.textContent = '连接中…'
      return
    }
    sub.textContent = '已连接 · ' + (sessionLabel || '电脑上的 DSH')
  }

  function setConnection(on) {
    connected = on
    dot.classList.toggle('on', on)
    renderSub()
  }

  function setStatus(kind, text) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '')
    statusText.textContent = text
    cancelButton.hidden = kind !== 'working'
  }

  function nearBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 90
  }

  function scrollDown() {
    log.scrollTop = log.scrollHeight
  }

  function addBubble(role, text) {
    empty.hidden = true
    const row = document.createElement('div')
    row.className = 'row' + (role === 'user' ? ' user' : '')
    const bubble = document.createElement('div')
    bubble.className = 'bubble ' + role
    const body = document.createElement('span')
    body.className = 'body'
    body.textContent = text
    bubble.appendChild(body)
    row.appendChild(bubble)
    const stick = nearBottom()
    log.appendChild(row)
    if (stick) scrollDown()
    return bubble
  }

  function bubbleBody(bubble) {
    return bubble.querySelector('.body')
  }

  function clearLive() {
    if (live) live.classList.remove('live')
    live = null
  }

  function ensureLive() {
    if (!live) live = addBubble('assistant', '')
    live.classList.add('live')
    return live
  }

  function clearDelta() {
    pendingDelta = ''
    if (deltaFrame) {
      cancelAnimationFrame(deltaFrame)
      deltaFrame = 0
    }
  }

  function sync(history) {
    for (const row of log.querySelectorAll('.row')) row.remove()
    live = null
    turnRendered = ''
    clearDelta()
    for (const row of history) addBubble(row.role, row.text)
    assistantSeen = history.filter(row => row.role === 'assistant').length
    empty.hidden = history.length > 0
    scrollDown()
  }

  function notifyDone(failed) {
    if (soundOn) beep(failed)
    try { navigator.vibrate?.(failed ? [200, 80, 200] : [90, 60, 90]) } catch { /* no vibration */ }
    if (document.hidden) document.title = (failed ? '⚠ ' : '● ') + titleBase
  }

  function beep(failed) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)()
      if (audio.state === 'suspended') audio.resume()
      const now = audio.currentTime
      const osc = audio.createOscillator()
      const gain = audio.createGain()
      osc.type = 'sine'
      osc.frequency.value = failed ? 320 : 880
      gain.gain.setValueAtTime(0.0001, now)
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02)
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3)
      osc.connect(gain).connect(audio.destination)
      osc.start(now)
      osc.stop(now + 0.32)
    } catch { /* audio is optional */ }
  }

  function describeReason(reason) {
    switch (reason) {
      case 'completed': return '完成'
      case 'aborted': return '已停止'
      case 'interrupted': return '已中断'
      case 'blocked': return '被拦截'
      case 'max-tokens': return '达到输出上限'
      case 'error': return '出错'
      default: return '结束'
    }
  }

  function applyTitle(title) {
    if (!title) return
    titleBase = title
    document.title = title
  }

  function applyTurn(data, notify) {
    if (!data || data.phase !== 'end') return
    clearDelta()
    if (data.text) {
      if (live) {
        bubbleBody(live).textContent = data.text
        clearLive()
        turnRendered = data.text
        assistantSeen += 1
      } else if (data.text !== turnRendered) {
        addBubble('assistant', data.text)
        turnRendered = data.text
        assistantSeen += 1
      }
    }
    clearLive()
    turnRendered = ''
    const failed = data.reason === 'error' || data.reason === 'blocked'
    const stopped = data.reason === 'aborted' || data.reason === 'interrupted'
    const seconds = data.ms > 0 ? ' · ' + (data.ms / 1000).toFixed(1) + ' 秒' : ''
    setStatus(failed ? 'failed' : stopped ? '' : 'done', describeReason(data.reason) + seconds + (data.message ? '：' + data.message : ''))
    if (notify && !stopped) notifyDone(failed)
    if (nearBottom()) scrollDown()
  }

  // Some proxies (the public tunnel included) buffer text/event-stream, so the
  // page falls back to polling this state when no SSE frame arrives in time.
  function startPolling() {
    if (pollTimer) return
    pollTimer = setInterval(() => { void pollState() }, 2500)
    void pollState()
  }

  function stopPolling() {
    if (!pollTimer) return
    clearInterval(pollTimer)
    pollTimer = 0
  }

  async function pollState() {
    try {
      const response = await api('/api/state')
      if (response.status === 401) {
        needsToken = true
        overlay.classList.add('show')
        stopPolling()
        return
      }
      if (!response.ok) return
      const data = await response.json()
      needsToken = false
      persistToken()
      applyTitle(data.title)
      const changed = typeof data.sessionId === 'string' && data.sessionId !== activeSessionId
      if (typeof data.sessionId === 'string') activeSessionId = data.sessionId
      if (typeof data.label === 'string' && data.label !== '') sessionLabel = data.label
      setConnection(true)
      if (changed) {
        lastTurnAt = null
        turnRendered = ''
        sync(Array.isArray(data.history) ? data.history : [])
      } else if (Array.isArray(data.history)) {
        const assistants = data.history.filter(row => row.role === 'assistant')
        if (assistants.length > assistantSeen) {
          const fresh = assistants.slice(assistantSeen)
          for (const row of fresh) {
            if (live) {
              bubbleBody(live).textContent = row.text
              clearLive()
            } else {
              addBubble('assistant', row.text)
            }
          }
          turnRendered = fresh[fresh.length - 1].text
          assistantSeen = assistants.length
          if (nearBottom()) scrollDown()
        }
      }
      if (!changed && data.lastTurn && data.lastTurn.at !== lastTurnAt) {
        lastTurnAt = data.lastTurn.at
        applyTurn({ ...data.lastTurn, phase: 'end' }, true)
      } else if (data.running) {
        if (!statusEl.classList.contains('working')) setStatus('working', 'DSH 正在工作…')
      } else if (statusEl.classList.contains('working')) {
        setStatus('', '等待指令')
      }
    } catch (error) {
      if (error && error.name === 'AbortError') return
    }
  }

  async function loadState() {
    try {
      const response = await api('/api/state')
      if (response.status === 401) {
        needsToken = true
        overlay.classList.add('show')
        return
      }
      if (!response.ok) throw new Error('HTTP ' + response.status)
      const data = await response.json()
      needsToken = false
      persistToken()
      applyTitle(data.title)
      const changed = typeof data.sessionId === 'string' && data.sessionId !== activeSessionId
      if (typeof data.sessionId === 'string') activeSessionId = data.sessionId
      if (typeof data.label === 'string' && data.label !== '') sessionLabel = data.label
      setConnection(true)
      if (changed) {
        lastTurnAt = null
        turnRendered = ''
      }
      if (Array.isArray(data.history) && (changed || !syncedOnce || !data.running)) {
        sync(data.history)
        syncedOnce = true
      }
      if (data.lastTurn) lastTurnAt = data.lastTurn.at
      if (data.error) {
        setStatus('failed', '会话恢复失败：' + data.error)
      } else if (data.running) {
        setStatus('working', 'DSH 正在工作…')
      } else {
        setStatus('', '等待指令')
      }
    } catch (error) {
      if (error && error.name === 'AbortError') return
      setConnection(false)
    }
  }

  function connect() {
    if (!token || needsToken) {
      overlay.classList.add('show')
      return
    }
    try { source?.close() } catch { /* already closed */ }
    stopPolling()
    helloSeen = false
    source = new EventSource('/api/events?k=' + encodeURIComponent(token))

    source.addEventListener('open', () => {
      const reconnected = everConnected
      everConnected = true
      setConnection(true)
      // A reconnect may have missed frames, including a whole finished turn.
      if (reconnected) loadState()
      // A proxy may hold the event-stream body; polling covers that case.
      setTimeout(() => { if (!helloSeen) startPolling() }, 4000)
    })

    source.addEventListener('error', () => {
      setConnection(false)
      startPolling()
    })

    source.addEventListener('hello', event => {
      const data = JSON.parse(event.data)
      helloSeen = true
      applyTitle(data.title)
      const changed = typeof data.sessionId === 'string' && data.sessionId !== activeSessionId
      if (changed) activeSessionId = data.sessionId
      if (typeof data.label === 'string' && data.label !== '') sessionLabel = data.label
      setConnection(true)
      if (changed) loadState()
      if (!data.running && statusEl.classList.contains('working')) setStatus('', '等待指令')
    })

    source.addEventListener('status', event => {
      const data = JSON.parse(event.data)
      if (data.running) {
        clearLive()
        clearDelta()
        turnRendered = ''
        setStatus('working', 'DSH 正在工作…')
      }
    })

    source.addEventListener('delta', event => {
      const data = JSON.parse(event.data)
      if (!data.text) return
      pendingDelta += data.text
      if (!deltaFrame) {
        deltaFrame = requestAnimationFrame(() => {
          deltaFrame = 0
          if (!pendingDelta) return
          const bubble = ensureLive()
          bubbleBody(bubble).append(pendingDelta)
          pendingDelta = ''
          if (nearBottom()) scrollDown()
        })
      }
    })

    source.addEventListener('step', event => {
      const data = JSON.parse(event.data)
      if (!data.text) return
      clearDelta()
      turnRendered = data.text
      if (live) {
        bubbleBody(live).textContent = data.text
        clearLive()
      } else {
        addBubble('assistant', data.text)
      }
      assistantSeen += 1
      if (nearBottom()) scrollDown()
    })

    source.addEventListener('tool', event => {
      const data = JSON.parse(event.data)
      if (data.phase === 'start') {
        toolNames.set(data.callId, data.name)
        setStatus('working', '正在使用工具 · ' + data.name)
      } else {
        const name = toolNames.get(data.callId) || '工具'
        toolNames.delete(data.callId)
        setStatus('working', data.ok ? 'DSH 正在工作…' : '工具失败 · ' + name)
      }
    })

    source.addEventListener('notice', event => {
      const data = JSON.parse(event.data)
      if (data.text) addBubble('note', data.text)
    })

    source.addEventListener('turn', event => {
      const data = JSON.parse(event.data)
      if (data.phase !== 'end') return
      lastTurnAt = typeof data.at === 'number' ? data.at : Date.now()
      applyTurn(data, true)
    })
  }

  async function send() {
    const text = input.value.trim()
    if (text === '' || sending) return
    sending = true
    sendButton.disabled = true
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)()
    } catch { /* audio is optional */ }
    addBubble('user', text)
    input.value = ''
    input.style.height = 'auto'
    try {
      const response = await api('/api/send', { method: 'POST', body: JSON.stringify({ text }) })
      if (response.status === 401) {
        needsToken = true
        overlay.classList.add('show')
        restore(text)
        return
      }
      const data = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(data.message || data.error || '发送失败')
      setStatus('working', 'DSH 正在工作…')
      scrollDown()
    } catch (error) {
      addBubble('note', '发送失败：' + (error?.message || error))
      setStatus('failed', '发送失败')
      restore(text)
    } finally {
      sending = false
      sendButton.disabled = false
    }
  }

  function restore(text) {
    if (input.value !== '') return
    input.value = text
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight, 160) + 'px'
  }

  sendButton.addEventListener('click', send)

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault()
      send()
    }
  })

  input.addEventListener('input', () => {
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight, 160) + 'px'
  })

  cancelButton.addEventListener('click', async () => {
    cancelButton.hidden = true
    setStatus('', '正在停止…')
    const fallback = setTimeout(() => { loadState() }, 12000)
    try {
      const response = await api('/api/cancel', { method: 'POST', body: '{}' })
      const data = await response.json().catch(() => ({}))
      if (data.running !== true) {
        clearTimeout(fallback)
        setStatus('', '等待指令')
      }
    } catch {
      clearTimeout(fallback)
      setStatus('failed', '停止失败，请重试')
    }
  })

  soundButton.addEventListener('click', () => {
    soundOn = !soundOn
    soundButton.classList.toggle('on', soundOn)
    soundButton.setAttribute('aria-pressed', String(soundOn))
    soundButton.title = soundOn ? '关闭完成提示音' : '开启完成提示音'
    if (soundOn) beep(false)
  })

  $('token-save').addEventListener('click', async () => {
    const value = $('token-input').value.trim()
    if (value === '') return
    token = value
    needsToken = false
    tokenHint.hidden = true
    overlay.classList.remove('show')
    await loadState()
    if (!needsToken) {
      connected = false
      connect()
    } else {
      token = ''
      overlay.classList.add('show')
      tokenHint.hidden = false
    }
  })

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return
    document.title = titleBase
    if (pollTimer) void pollState()
    else if (source) loadState()
  })

  window.addEventListener('focus', () => { document.title = titleBase })

  loadState().then(connect)
})()
</script>
</body>
</html>
